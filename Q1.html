<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Question 1</title>
</head>
<body>

    <div id="myElement">
        <p>Welcome to my website!</p>
    </div>

    <script>
        // Automatically changes paragraph text upon page load
        window.onload = function() {
            document.querySelector("#myElement p").textContent = "Hello there!";
        };
    </script>

</body>
</html>
